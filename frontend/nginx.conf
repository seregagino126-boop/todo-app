server {
    listen 80;
    server_name localhost;

    # Корневая папка со статикой.
    root /usr/share/nginx/html;
    index index.html;

    #Проксирование API-запросов на backend
    # Всё что начинается с /api/ - уходит на api:8080
    #внутри Docker сети
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host &host;
        proxy_set_header X-Real-IP &remote_addr;
        proxy_set_header X-Forwarded-For &proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto &scheme;
    }



    # Все запросы — на index.html.
    # Нужно для SPA (одностраничных приложений).
    # Если пользователь обновит страницу на /tasks — Nginx отдаст index.html,
    # а Vue Router сам разберётся с маршрутом.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
